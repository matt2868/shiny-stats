<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<style>
/* Layout: a handheld in light console grey — panels on the case, green LCD screens for the counter and big totals, a fixed tab bar. One deliberate light look. */
:root{
  color-scheme:light;
  --bg:#c4c3bd; --surface:#d9d8d2; --surface-2:#ecebe6; --line:#a9a8a1; --shadow:#7d7c76;
  --ink:#26262a; --muted:#56554f;
  --berry:#9b2f55; --berry-d:#6c1f3b; --berry-t:#ecd3dc;
  --indigo:#3f4f9e; --indigo-d:#2b376f; --indigo-t:#d3d8ee;
  --teal:#2b7a6f; --teal-d:#1c544c; --teal-t:#cfe4df;
  --amber:#c48d00; --amber-d:#8a6300; --amber-dd:#5e4400; --amber-t:#f0e1b5;
  --green:#4a7f2c; --green-d:#2a4a18; --green-t:#d9e8cc;
  --red:#b23a2a; --red-d:#7a2318; --red-t:#f3d0cc;
  --lcd:#b9c59c; --lcd-ink:#26331c; --lcd-mid:#4d5e38; --lcd-track:#97a67a; --lcd-panel:#a7b58a;
  --bezel:#55545a; --bezel-in:#3f3e43;
  --scan:repeating-linear-gradient(0deg, rgb(0 0 0 / .06) 0 1px, transparent 1px 3px);
  /* legacy names used by components */
  --accent:var(--berry); --accent-ink:#ffffff; --accent-soft:var(--berry-t);
  --shiny:var(--amber-d); --shiny-soft:var(--amber-t);
  --good:var(--teal-d); --good-soft:var(--teal-t); --bad:var(--berry-d); --bad-soft:var(--berry-t);
  --font-display:"VT323", "Courier New", ui-monospace, monospace;
  --font-label:"Silkscreen", "Courier New", ui-monospace, monospace;
  --font-body:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --tabbar:62px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1em)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.label{font-family:var(--font-label);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
.muted{color:var(--muted)}

#app{min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom, 0px));max-width:760px;width:100%;margin:0 auto}
.view{display:flex;flex-direction:column;gap:14px}
.cgrid,.ccol,.sgstack,.sgstack2{display:contents}
.today{display:flex;flex-direction:column;gap:12px}
.td-side{display:flex;flex-direction:column;gap:8px;min-width:0}
.td-hist{border-top:2px dashed var(--line);padding-top:12px}
.td-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.td-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.td-stats span{display:flex;flex-direction:column;gap:1px;min-width:0}
.td-stats b{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1;white-space:nowrap}.td-stats b small{font-size:14px}
.td-stats em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;height:96px;background:var(--lcd);background-image:var(--scan);border-radius:10px;padding:8px 8px 4px}
.td-b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;border:none;background:none;padding:0;min-width:0;cursor:pointer;height:100%}
.td-b span{width:100%;max-width:18px;background:var(--lcd-mid);border-radius:2px 2px 0 0;min-height:0}
.td-b i{font-style:normal;font-family:var(--font-label);font-size:8px;color:var(--lcd-mid);line-height:1}
.td-b.now span{background:var(--amber)}.td-b.on i{color:var(--lcd-ink);text-decoration:underline}.td-b.on span{box-shadow:0 0 0 2px var(--lcd-ink)}
#pane{display:none}
.batch,.wideonly{display:none}
.narrowonly{display:flex}
.rg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 6px}
.rgc{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;border:none;background:none;padding:4px 0;border-radius:10px;cursor:pointer;font:inherit;color:inherit}
.rgc:active{background:var(--surface-2)}
.rgn{font-weight:600;font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rgp{display:flex;align-items:center;justify-content:center;min-height:14px}.rgp svg{width:13px;height:13px}
.rgc .gb{font-size:10px;max-width:100%}.narrowonly .rgc .gb{font-size:9px}
.pbm{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.pbr{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 3.4em 4.6em;gap:10px;align-items:center;font-size:13px;color:var(--lcd-ink)}
.pbn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbt{height:12px;background:rgb(0 0 0 / .08);border-radius:2px;overflow:hidden}.pbt i{display:block;height:100%;background:var(--lcd-mid)}
.pbr b{font-family:var(--font-display);font-weight:400;font-size:20px;text-align:right}.pbh{font-size:11px;color:var(--lcd-mid);text-align:right;white-space:nowrap}
/* unfolded foldables, tablets in landscape, computers: counter on the left, everything else beside it */
@media (min-width:680px) and (min-aspect-ratio:4/5){
  main:has(.cgrid){max-width:1180px}
  .cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .ccol{display:flex;flex-direction:column;gap:14px;min-width:0}
  .cgrid > .ccol:first-child{position:sticky;top:12px}
  .batch{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .batch .btn{min-height:46px;padding:0;font-family:var(--font-display);font-size:24px;letter-spacing:0}
  .wideonly{display:flex}
  .narrowonly{display:none}
  .statsv > .sgstack2{display:flex;flex-direction:column;gap:14px;min-width:0}
  .ccol .today{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;padding:12px 14px}
  .ccol .today .td-now{padding-right:16px}
  .ccol .today .td-hist{border-top:none;padding-top:0;border-left:2px dashed var(--line);padding-left:16px}
  .ccol .today .td-stats{grid-template-columns:1fr;gap:3px;align-content:center;flex:1}
  .ccol .today .td-stats span{flex-direction:row;align-items:baseline;gap:6px}
  .ccol .today .td-stats b{font-size:20px}
  .ccol .today .td-bars{height:92px}
  body.paned main{max-width:none;width:auto;margin:0 min(44%,560px) 0 0}
  body.paned #pane{display:block;position:fixed;top:0;right:0;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 2px);width:min(44%,560px);overflow:auto;overscroll-behavior:contain;border-left:2px solid var(--line);background:var(--bg);z-index:15}
  #pane .sheet{max-width:none;max-height:none;overflow:visible;overscroll-behavior:auto;border-radius:0;box-shadow:none;background:transparent;padding:18px 18px 28px;animation:none}
  #pane .phbig{height:min(170px,26vh)}
  .paneempty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:14px;text-align:center;padding:24px;opacity:.8}
  .dc.sel{outline:3px solid var(--berry);outline-offset:1px}
  .item.sel{box-shadow:inset 4px 0 0 var(--berry);background:var(--surface-2)}
  .dexrow.sel{box-shadow:inset 4px 0 0 var(--berry)}
  main:has(.statsv){max-width:1180px}
  .statsv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:14px;align-items:start}
  .statsv > *{min-width:0}
  .statsv > .sgstack{display:flex;flex-direction:column;gap:14px;min-width:0}
  .statsv > .viewhead,.statsv > .s2{grid-column:1/-1}
}
.viewhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;padding-bottom:14px}
.viewhead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--berry) 0 25%,var(--amber) 25% 50%,var(--teal) 50% 75%,var(--indigo) 75% 100%)}
.viewhead h1{font-size:42px}
.topline{font-family:var(--font-label);font-size:12px;letter-spacing:.12em;color:var(--muted)}
.rec{font-family:var(--font-label);font-size:12px;color:#c0392b}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));
  display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{position:relative;height:var(--tabbar);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-family:var(--font-label);font-size:11px;letter-spacing:.02em;text-transform:uppercase}
nav.tabs a svg{display:none}
nav.tabs a[aria-current="page"]{color:var(--berry)}
nav.tabs a[aria-current="page"]::before{content:"";position:absolute;top:-2px;left:18%;right:18%;height:3px;background:var(--berry)}

/* generic */
.card{background:var(--surface);border:none;border-radius:var(--r);padding:14px}
.btn{border:none;background:var(--surface);border-radius:10px;padding:10px 14px;font-family:var(--font-label);font-size:13px;text-transform:uppercase;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;box-shadow:0 3px 0 var(--shadow);color:var(--ink);text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn.primary{background:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-d)}
.btn.indigo{background:var(--indigo);color:#fff;box-shadow:0 4px 0 var(--indigo-d)}
.btn.teal{background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d)}
.btn.berry{background:var(--berry);color:#fff;box-shadow:0 4px 0 var(--berry-d)}
.btn.shiny{background:var(--amber);color:var(--ink);box-shadow:0 5px 0 var(--amber-d)}
.btn.danger{background:var(--surface);color:var(--berry-d);box-shadow:0 3px 0 var(--berry)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:active{transform:none}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--teal-t);color:var(--teal-d)}
.chip.bad{background:var(--berry-t);color:var(--berry-d)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
.chip.shiny{background:var(--amber-t);color:var(--amber-dd)}

/* counter */
.hunt-pick{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.hunt-pick .pickarea{display:flex;align-items:center;gap:10px;border:none;background:none;padding:2px;text-align:left;flex:1;min-width:0;border-radius:8px}
.hunt-pick .t{font-family:var(--font-display);font-size:38px;line-height:.95;text-transform:uppercase;letter-spacing:.02em}
.hunt-pick .s{font-size:12px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px}
.hunt-pick .s .c1{background:var(--indigo-t);color:var(--indigo-d)}
.hunt-pick .s .c2{background:var(--teal-t);color:var(--teal-d)}
.hunt-pick .s .c3{background:var(--berry-t);color:var(--berry-d)}
.hunt-pick .s > span{padding:1px 7px;border-radius:4px;font-weight:600}
.hunt-pick svg{width:20px;height:20px;color:var(--muted);flex:none}
.hunt-pick .edit{font-family:var(--font-label);font-size:12px;color:var(--teal);background:none;border:none;padding:8px 4px;flex:none}
.tap{position:relative;width:100%;border:none;background:var(--bezel);border-radius:22px;padding:14px;box-shadow:inset 0 0 0 2px var(--bezel-in),0 6px 0 var(--shadow);
  color:var(--lcd-ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;display:block}
.tap:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--bezel-in),0 3px 0 var(--shadow)}
.lcd{background-color:var(--lcd);background-image:var(--scan);border-radius:12px}
.tap .lcd{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px 14px}
.ring{position:relative;width:210px;height:210px;flex:none}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .ph-in{position:absolute;left:45px;top:45px;width:120px;height:120px;border-radius:10px;background:var(--lcd-panel);display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:0}
.ring .ph-in img{display:block;max-width:none}
.ring .ph-in img.cover{width:120px;height:120px;object-fit:contain}
.tap .count{white-space:nowrap;font-family:var(--font-display);font-size:104px;line-height:.82;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--lcd-ink)}
.tap .hint{font-family:var(--font-label);font-size:12px;color:var(--lcd-mid);letter-spacing:.08em;text-transform:uppercase}
.tap.bump .count{animation:bump .14s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.lcd.pulse{animation:pulse 1.1s ease-out}
.lcd{position:relative;transition:background-color .6s steps(4,end)}
.lcd[data-lap="emerald"]{--lcd:#bfe2cb;--lcd-ink:#0d3520;--lcd-mid:#24603d;--lcd-track:#8fc6a2;--lcd-panel:#a8d4b7}
.lcd[data-lap="charm"]{--lcd:#f7d3e6;--lcd-ink:#3b1335;--lcd-mid:#7a3a6d;--lcd-track:#d9b0cf;--lcd-panel:#e5c4dc}
.lcd[data-lap="1"]{--lcd:#dccb8a;--lcd-ink:#3a2c08;--lcd-mid:#6b5416;--lcd-track:#c2ab62;--lcd-panel:#cdb873}
.lcd[data-lap="2"]{--lcd:#b7d5dc;--lcd-ink:#12333b;--lcd-mid:#2f5f69;--lcd-track:#8cb8c1;--lcd-panel:#a3c7cf}
.lcd[data-lap="3"]{--lcd:#241c38;--lcd-ink:#efe6ff;--lcd-mid:#b9a7e0;--lcd-track:#3f3360;--lcd-panel:#33294f}
.lcd[data-lap="4"]{--lcd:#e3c2c6;--lcd-ink:#3d141e;--lcd-mid:#7a2f3e;--lcd-track:#cc98a1;--lcd-panel:#d8aeb5}
.lcd[data-lap="1"] .laplab{color:#6b5416}
.lcd.flash{animation:lcdflash .9s steps(6,end)}
@keyframes lcdflash{0%,100%{filter:none}16%{filter:invert(1)}33%{filter:none}50%{filter:invert(1)}66%{filter:none}83%{filter:brightness(1.25) saturate(1.4)}}
.minisparks{position:absolute;inset:0;pointer-events:none;z-index:3}
.minisparks i{position:absolute;left:50%;top:42%;display:block;opacity:0;animation:minispark 1.2s steps(6) forwards}
@keyframes minispark{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(calc(var(--dx) * 3),calc(var(--dy) * 3)) scale(1)}}
.bigban{position:absolute;left:8%;right:8%;top:38%;z-index:4;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 12px;border-radius:10px;background:var(--lcd-ink);color:var(--lcd);box-shadow:0 0 0 3px var(--amber);animation:banin .35s steps(4,end);pointer-events:none}
.bigban[hidden]{display:none}
#f-preblock[hidden]{display:none}
.bigban b{font-family:var(--font-display);font-weight:400;font-size:48px;line-height:.9;text-transform:uppercase}
.bigban span{font-family:var(--font-label);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.bigban.k1{box-shadow:0 0 0 3px #c48d00,0 0 0 5px #ffe680}.bigban.k2{box-shadow:0 0 0 3px #7fd3e6,0 0 0 5px #ffffff}.bigban.k3{background:#0a0012;color:#efe6ff;box-shadow:0 0 0 3px #7a2cff,0 0 0 6px #2b48ff,0 0 18px #7a2cff}.bigban.k4{box-shadow:0 0 0 3px #ff2d2d,0 0 0 6px #ffd400,0 0 0 9px #22c55e,0 0 0 12px #3b5bff,0 0 0 15px #a020f0}
@keyframes banin{0%{transform:scaleX(.1)}100%{transform:scaleX(1)}}
.tickgem{animation:gempulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes gempulse{0%,100%{filter:none}50%{filter:brightness(1.25) drop-shadow(0 0 3px #fff8)}}
@media (prefers-reduced-motion: reduce){.tickgem{animation:none}}
.laplab{color:var(--lcd-ink);font-weight:700}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pip{display:inline-block;width:11px;height:11px;transform:rotate(45deg);box-shadow:0 0 0 1px rgb(0 0 0 / .4);background-size:300% 300%;animation:pipshine 2.4s linear infinite}
.star{display:inline-block;width:17px;height:17px;vertical-align:middle;overflow:visible;animation:glint 7s ease-in-out infinite}
.pips .star:nth-child(2){animation-delay:-1.3s}.pips .star:nth-child(3){animation-delay:-2.9s}.pips .star:nth-child(4){animation-delay:-4.4s}
.pips:nth-of-type(2n) .star{animation-duration:8.5s}
@keyframes glint{0%,86%,100%{transform:none}90%{transform:scale(1.14)}94%{transform:none}}
.star .gl{opacity:0;animation:glintfill 7s ease-in-out infinite;animation-delay:inherit;animation-duration:inherit;pointer-events:none}
@keyframes glintfill{0%,86%,100%{opacity:0}90%{opacity:.75}95%{opacity:0}}
.pips svg.star,.chart .pips svg.star{width:17px;height:17px;display:inline-block}
@media (prefers-reduced-motion: reduce){.star,.star .gl{animation:none}}





.pip.p1{background-image:linear-gradient(135deg,#8a6300,#c48d00 20%,#fff1a8 35%,#c48d00 50%,#8a6300 65%,#ffd84d 80%,#8a6300)}
.pip.p2{background-image:linear-gradient(135deg,#5fc0d8,#e8fbff 18%,#7fd3e6 34%,#ffffff 46%,#2f8fa3 62%,#c9f4fc 80%,#5fc0d8);animation-duration:1.8s}
.pip.p3{background-image:linear-gradient(120deg,#0a0012,#3b0a6b 18%,#12001f 32%,#2b48ff 48%,#0a0012 62%,#b04cff 78%,#0a0012);box-shadow:0 0 0 1px #000,0 0 4px #7a2cff;animation-duration:3.2s}
.pip.p4{background-image:linear-gradient(135deg,#ff2d2d,#ff8a00,#ffd400,#22c55e,#06b6d4,#3b5bff,#a020f0)}
@keyframes pipshine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes piphue{0%{filter:hue-rotate(0deg) saturate(1.3)}100%{filter:hue-rotate(360deg) saturate(1.3)}}
@media (prefers-reduced-motion: reduce){.pip{animation:none}}
.cd.oh::before{content:"";position:absolute;right:1px;top:1px;width:4px;height:4px;background:#7fd3e6;box-shadow:0 0 0 1px rgb(0 0 0 / .3)}
@media (prefers-reduced-motion: reduce){.lcd.flash,.minisparks i,.bigban{animation:none}.minisparks{display:none}}
@keyframes pulse{0%{filter:brightness(1)}15%{filter:brightness(1.18) saturate(1.3)}30%{filter:brightness(1)}45%{filter:brightness(1.18) saturate(1.3)}100%{filter:brightness(1)}}
@media (prefers-reduced-motion: reduce){.tap.bump .count,.lcd.pulse{animation:none}}
.lasttap{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:8px;padding:8px 12px;box-shadow:inset 0 0 0 2px transparent}

function foundFlow() {
  const e = S.entries.get(S.meta.activeId); if (!e) return;

    return `<i style="left:${(rnd() * 96).toFixed(1)}%;top:${(rnd() * 92).toFixed(1)}%;width:${sz}px;height:${sz}px;background:${cols[i % 4]};animation-delay:${(i * 0.045).toFixed(2)}s"></i>`; }).join("");

    <div class="found-pic" id="fd-prev">${pic}</div>
    <div class="found-stats"><span><b>${fmt(e.encounters)}</b><em>ENCOUNTERS</em></span><span><b>${fmt(ratio(e), 2)}×</b><em>ODDS</em></span><span><b>${pct(pShiny(e))}</b><em>P BY NOW</em></span></div>
    <button class="btn shiny" data-act="target" style="min-height:56px">It's ${esc(e.name)} · done</button>
    <div class="phasebox">
      <b>It's a different Pokémon</b>

      <button class="btn indigo" data-act="phase">Phase · keep hunting ${esc(e.name)}</button>

}
const dur = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60) + " min"; };
const perHour = (enc, ms) => ms > 0 ? enc / (ms / 3600e3) : 0;
/** Pace details: the current stretch, a reset to start a new one, and earlier stretches to compare. */
function paceSheet() {
  const e = S.entries.get(S.meta.activeId); if (!e) return;

  openSheet(`<h2>Pace</h2>
    <div class="card lcd" style="display:flex;justify-content:space-between;align-items:baseline;color:var(--lcd-ink)">
      <span style="display:flex;flex-direction:column;gap:2px"><span class="label" style="color:var(--lcd-mid)">This stretch</span><span style="font-size:13px">${fmt(e.timedEnc)} timed encounters · ${dur(e.activeMs)}</span></span>
      <span style="font-family:var(--font-display);font-size:44px;line-height:1">${cur ? fmt(cur) : "—"}<small style="font-size:16px">/h</small></span>
    </div>
    <p class="muted" style="margin:0;font-size:13px">Pauses longer than ${ago(breakLimit(e)).replace(" ago", "")} between taps count as breaks and are left out. Quick taps under a second apart (counting a batch) don't change that limit.</p>
    <div class="field"><label class="label" for="f-pacelabel">Name this stretch (optional)</label><input id="f-pacelabel" autocomplete="off" placeholder="e.g. old method, with Repel trick"></div>
    <button class="btn berry" data-act="pacereset" ${e.timedEnc || e.activeMs ? "" : "disabled"}>Reset pace</button>
    <span class="muted" id="pacehint" style="font-size:13px;margin-top:-6px">Saves this stretch below and starts timing afresh from your next taps. Your encounter count isn't changed.</span>
    ${hist.length ? `<h3 style="font-family:var(--font-label);font-size:13px;letter-spacing:.04em">Earlier stretches</h3>
    <div class="list">${hist.map(h => `<div class="snap"><div><b>${esc(h.label || "Unnamed stretch")}</b><div class="m">${fmt(h.enc)} encounters · ${dur(h.ms)} · ended ${dateStr(h.at)}</div></div><span style="font-family:var(--font-display);font-size:30px">${fmt(perHour(h.enc, h.ms))}<small style="font-size:13px">/h</small></span></div>`).join("")}</div>` : ""}

}

/* ===================== wiring ===================== */

    else if (a === "editactive") openHunt(S.meta.activeId);
    else if (a === "pace") paceSheet();
    else if (a === "adddex") addToDex(0);
    else if (a === "minus") { const e = S.entries.get(S.meta.activeId); if (e) tap(-e.step); }
    else if (a === "step") stepSheet();
    else if (a === "setcount") setCountSheet();

    else if (a === "gh-connect") {

      if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { toast("Enter the repository as owner/name"); return; }
      if (!token) { toast("Paste the access token"); return; }
      ghSave({ repo, token }); gh.state = "syncing"; render();
      ghSync().then(() => toast(gh.state === "on" ? "Connected · synced with GitHub" : gh.detail));
    }
    else if (a === "gh-sync") ghSync().then(() => toast(gh.state === "on" ? "Synced" : gh.detail));
    else if (a === "gh-off") { ghSave(null); gh.state = "off"; render(); toast("GitHub sync turned off on this device"); }
    else if (a === "exp-json") doExport("json");
    else if (a === "exp-csv") doExport("csv");
    else if (a === "copy-json") copyJSON();
    else if (a === "paste") openSheet(`<h2>Paste JSON</h2><textarea class="dump" id="pastebox" placeholder="Paste an export here"></textarea><div class="row"><button class="btn primary" data-act="go">Continue</button><button class="btn ghost" data-close>Cancel</button></div>`, sh => { $("[data-act=go]", sh).onclick = () => { const v = $("#pastebox", sh).value; closeSheet(); startImport(v); }; });
  }));
  m.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { S.huntFilter = b.dataset.filter; render(); });
  const dord = $("[data-act=doneorder]", m); if (dord) dord.onclick = () => { S.doneOldest = !S.doneOldest; try { localStorage.setItem("ss-doneOldest", S.doneOldest ? "1" : ""); } catch (err) {} render(); };

  m.querySelectorAll(".dexrow[data-dex]").forEach(b => b.onclick = () => openDex(Number(b.dataset.dex)));

  m.querySelectorAll("[data-dexmode]").forEach(b => b.onclick = () => { S.dexMode = b.dataset.dexmode; render(); });

  const hh = $("#hist-hit", m);

/* ===================== screen wake lock while counting ===================== */
let wakeLock = null;
async function acquireWake() {
  if (current !== "counter" || document.visibilityState !== "visible" || wakeLock) return;
  try { if ("wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (err) { wakeLock = null; }
}
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (err) {} wakeLock = null; }

/* ===================== offline install (only when hosted on its own, e.g. GitHub Pages) ===================== */
function setupPWA() {
  if (window.claude || window.self !== window.top || !("serviceWorker" in navigator) || location.protocol === "file:") return;
  if (!document.querySelector('link[rel="manifest"]')) { const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l); }
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
